name: Health Check Monitoring

on:
  schedule:
    # Regular health checks every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allow manual triggering


jobs:
  health_monitoring:
    name: Monitor Application Health
    runs-on: ubuntu-latest
    steps:
      - name: Send health check request
        run: |
          MAX_RETRIES=10
          RETRY_DELAY=30
          URL="https://esociety-fdbd.onrender.com/health"
          
          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i of $MAX_RETRIES..."
            # Use -L to follow redirects and increase max time to 120 seconds for cold starts
            response=$(curl -L -s -o /dev/null -w "%{http_code}" -m 120 "$URL" || echo "000")
            
            # Remove any non-numeric characters just in case
            response="${response//[^0-9]/}"
            
            # Check if response is numeric and within success range
            if [[ -n "$response" ]] && (( 10#$response >= 200 && 10#$response < 300 )); then
              echo "Health check successful with status code: $response"
              exit 0
            else
              echo "Health check failed with status code: ${response:-unknown}. Retrying in $RETRY_DELAY seconds..."
              sleep "$RETRY_DELAY"
            fi
          done
          
          echo "Health check failed after $MAX_RETRIES attempts."
          exit 1

      - name: Log health status
        run: echo "Health check completed successfully at $(date)"
